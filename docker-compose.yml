services:
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_GATEWAY_DB}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:14-alpine
    container_name: hospital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: hospital-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_KEY: ${GATEWAY_APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_GATEWAY_DB}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TOKEN_SECRETO: ${TOKEN_SECRETO}
      PATIENTS_SERVICE_URL: http://patient-service:8001/api/patients
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3000/api/appointments
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8002/api/notifications/
      PHARMACY_SERVICE_URL: http://pharmacy-service:3001/api/pharmacy
      MEDICAL_RECORDS_SERVICE_URL: http://medicalrecords-service:5000/api/medical-records
      MEDICAL_RECORDS_SECRET_TOKEN: Token ${TOKEN_SECRETO}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hospital-network

  patient-service:
    build:
      context: . 
      dockerfile: services/laravel-patient-service/Dockerfile
    container_name: hospital-patient-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_KEY: ${PATIENTS_APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_PATIENTS_DB}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TOKEN_SECRETO: ${TOKEN_SECRETO}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hospital-network

  notifications-service:
    build:
      context: ./services/django-notifications-service
      dockerfile: Dockerfile
    container_name: hospital-notifications-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      TOKEN_SECRETO: ${TOKEN_SECRETO}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network

  appointments-service:
    build:
      context: ./services/express-appointments-service
      dockerfile: Dockerfile
    container_name: hospital-appointments-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TOKEN_SECRETO: ${TOKEN_SECRETO}
      NODE_ENV: production
    volumes:
      - ./services/express-appointments-service/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - hospital-network

  pharmacy-service:
    build:
      context: ./services/express-pharmacy-service
      dockerfile: Dockerfile
    container_name: hospital-pharmacy-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      TOKEN_SECRETO: ${TOKEN_SECRETO}
      MONGO_URI: ${MONGO_URI_PHARMACY}
      PORT: 3001
      NODE_ENV: production
    networks:
      - hospital-network

  medicalrecords-service:
    build:
      context: ./services/flask-medicalrecords-service
      dockerfile: Dockerfile
    container_name: hospital-medicalrecords-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TOKEN_SECRETO: ${TOKEN_SECRETO}
      MONGO_URI: ${MONGO_URI_RECORDS}
      PORT: 5000
    networks:
      - hospital-network


volumes:
  mysql_data:
  postgres_data:

networks:
  hospital-network:
    driver: bridge